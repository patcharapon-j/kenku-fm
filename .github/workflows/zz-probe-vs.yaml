name: Probe VS (temporary)

on: push

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Image and Visual Studio info
        shell: pwsh
        run: |
          Write-Host "requested label: ${{ matrix.os }}"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -prerelease -format json | ForEach-Object { $_ }
          } else {
            Write-Host "no vswhere"
          }
